<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b162a" />
      <stop offset="100%" stop-color="#010308" />
    </linearGradient>
    
    <!-- Flashlight Cone Gradient -->
    <linearGradient id="flashlightGlow" x1="0%" y1="100%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="25%" stop-color="#fef08a" stop-opacity="0.55" />
      <stop offset="60%" stop-color="#facc15" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#eab308" stop-opacity="0" />
    </linearGradient>

    <!-- Radar Sweep Glow -->
    <radialGradient id="radarGlow" cx="0%" cy="100%" r="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>

    <!-- Portal membrane red gradient -->
    <radialGradient id="portalRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe4e6" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#fb7185" stop-opacity="0.75" />
      <stop offset="70%" stop-color="#e21d26" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#450a0a" stop-opacity="0" />
    </radialGradient>

    <!-- Deep sea blue gradient -->
    <radialGradient id="blueAbyss" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0891b2" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#0e7490" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0c2333" stop-opacity="0" />
    </radialGradient>

    <!-- Tactical Rainbow Gradient for S04E07 -->
    <linearGradient id="rainbowGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="20%" stop-color="#f97316" />
      <stop offset="40%" stop-color="#eab308" />
      <stop offset="60%" stop-color="#10b981" />
      <stop offset="80%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>

  <!-- 1. Background Fill -->
  <rect width="800" height="450" fill="url(#bgGrad)" />

